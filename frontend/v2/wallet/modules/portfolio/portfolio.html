<main id="portfolioPage" class="relative z-10 flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-10 py-10">
  <div class="flex justify-between items-center mb-8">
    <div>
      <h2 class="font-display text-2xl font-bold text-white">Your Portfolio</h2>
      <p class="text-gray-400 text-sm mt-1">All names and TLDs you own across the registry</p>
    </div>
    <button class="glass-card px-4 py-2 rounded-lg text-sm text-white hover:bg-white/10 transition-all" id="syncPortfolioBtn">
      <i class="fas fa-sync-alt mr-2"></i> Sync
    </button>
  </div>
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
    <div class="glass-panel p-4 rounded-2xl text-center">
      <div class="text-gray-500 text-xs uppercase mb-1">Total Names</div>
      <div class="text-2xl font-bold text-white" id="statTotalNames">-</div>
    </div>
    <div class="glass-panel p-4 rounded-2xl text-center">
      <div class="text-gray-500 text-xs uppercase mb-1">TLDs Owned</div>
      <div class="text-2xl font-bold text-purple-400" id="statTldsOwned">-</div>
    </div>
    <div class="glass-panel p-4 rounded-2xl text-center">
      <div class="text-gray-500 text-xs uppercase mb-1">Subdomains</div>
      <div class="text-2xl font-bold text-cyan-400" id="statSubdomains">-</div>
    </div>
    <div class="glass-panel p-4 rounded-2xl text-center">
      <div class="text-gray-500 text-xs uppercase mb-1">Primary Name</div>
      <div class="text-sm font-bold text-green-400 mono" id="statPrimary">-</div>
    </div>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="portfolioGrid"></div>
</main>
